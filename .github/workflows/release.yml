name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend/build

      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: dashboard/build

      - name: Package release bundle
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tallymark-${{ github.ref_name }}.tar.gz
            dist/tallymark.tar.gz
            dist/function.zip
