AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tallymark - tiny, privacy-respecting, self-hosted web analytics

Parameters:
  ApiKeyParam:
    Type: String
    NoEcho: true
    Description: API key for dashboard authentication (Bearer token)

  AllowedSitesParam:
    Type: String
    Default: ""
    Description: Comma-separated list of allowed siteIds (e.g. "example.com,blog.example.com"). Empty means no restriction.

  TableNameParam:
    Type: String
    Default: ""
    Description: Optional fixed DynamoDB table name. Leave empty to let CloudFormation generate one.

  DashboardBucketNameParam:
    Type: String
    Default: ""
    Description: Optional fixed S3 bucket name for the dashboard (must be globally unique). Leave empty to let CloudFormation generate one.

Conditions:
  HasTableName: !Not [!Equals [!Ref TableNameParam, ""]]
  HasDashboardBucketName: !Not [!Equals [!Ref DashboardBucketNameParam, ""]]

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - x86_64

Resources:

  # --- API Gateway (REST API v1, compatible with hal ProxyRequest) ---
  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET, POST, DELETE, OPTIONS'"
        AllowHeaders: "'Content-Type, Authorization'"
        MaxAge: "'86400'"

  # --- Lambda Function ---
  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/build/function.zip
      Handler: bootstrap
      Events:
        Track:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /track
            Method: POST
        Stats:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /stats
            Method: GET
        SitesList:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /sites
            Method: GET
        SitesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /sites
            Method: DELETE
      Environment:
        Variables:
          TABLE_NAME: !Ref PageViewsTable
          DYNAMODB_ENDPOINT: ""
          API_KEY: !Ref ApiKeyParam
          ALLOWED_SITES: !Ref AllowedSitesParam
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PageViewsTable

  # --- DynamoDB Table ---
  # Retained on stack deletion/replacement so your data is never dropped by accident
  PageViewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [HasTableName, !Ref TableNameParam, !Ref AWS::NoValue]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByDate
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # --- S3 Bucket for Dashboard ---
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasDashboardBucketName, !Ref DashboardBucketNameParam, !Ref AWS::NoValue]
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${AnalyticsApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DashboardBucketName:
    Description: S3 bucket that hosts the dashboard
    Value: !Ref DashboardBucket
  DashboardUrl:
    Description: Dashboard S3 website URL
    Value: !GetAtt DashboardBucket.WebsiteURL
