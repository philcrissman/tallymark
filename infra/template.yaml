AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Self-hosted analytics for philcrissman.net

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - x86_64

Resources:

  # --- API Gateway (REST API v1, compatible with hal ProxyRequest) ---
  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'https://philcrissman.net'"
        AllowMethods: "'GET, POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        MaxAge: "'86400'"

  # --- Lambda Function ---
  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/build/function.zip
      Handler: bootstrap
      Events:
        Track:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /track
            Method: POST
        Stats:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /stats
            Method: GET
      Environment:
        Variables:
          TABLE_NAME: !Ref PageViewsTable
          DYNAMODB_ENDPOINT: ""
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PageViewsTable

  # --- DynamoDB Table ---
  PageViewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PageViews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByDate
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # --- S3 Bucket for Dashboard ---
  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: philcrissman-analytics-dashboard
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${AnalyticsApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DashboardUrl:
    Description: Dashboard S3 website URL
    Value: !GetAtt DashboardBucket.WebsiteURL
