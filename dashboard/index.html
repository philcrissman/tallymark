<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - philcrissman.net</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
  <script>
    // For local dev, override with query param: ?api=http://localhost:3000
    var params = new URLSearchParams(window.location.search);
    var apiUrl = params.get('api') || 'https://9fiawrlc8a.execute-api.us-west-2.amazonaws.com/prod';
    var savedKey = sessionStorage.getItem('analyticsApiKey') || '';

    var app = Elm.Main.init({
      node: document.getElementById('app'),
      flags: { apiUrl: apiUrl, savedApiKey: savedKey }
    });

    // Listen for API key changes from Elm and persist to sessionStorage
    app.ports.saveApiKey.subscribe(function(key) {
      if (key) {
        sessionStorage.setItem('analyticsApiKey', key);
      } else {
        sessionStorage.removeItem('analyticsApiKey');
      }
    });
  </script>
</body>
</html>
