<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - philcrissman.net</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <script src="build/elm.js"></script>
  <script>
    // For local dev, override with query param: ?api=http://localhost:3000
    var params = new URLSearchParams(window.location.search);
    var apiUrl = params.get('api') || '';

    Elm.Main.init({
      node: document.getElementById('app'),
      flags: { apiUrl: apiUrl }
    });
  </script>
</body>
</html>
